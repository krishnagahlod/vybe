<svg width="600" height="750" viewBox="0 0 600 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Subtle warm gradient background -->
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdfb" />
      <stop offset="50%" stop-color="#ffe5d9" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#d8e2dc" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4acb7" />
      <stop offset="100%" stop-color="#9d8189" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="750" fill="url(#cardBg)"/>
  
  <!-- Subtle geometric studio arches -->
  <circle cx="300" cy="320" r="180" stroke="#e9e2e1" stroke-width="1.5" stroke-dasharray="4 4" fill="none" />
  <circle cx="300" cy="320" r="130" stroke="#9d8189" stroke-opacity="0.25" stroke-width="1.5" fill="none" />
  
  <!-- Stylized activewear contour / hanger silhouette -->
  <g transform="translate(240, 260)" stroke="#9d8189" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Hanger hook and shoulder line -->
    <path d="M60 20 C60 5, 45 5, 45 15 C45 28, 60 30, 60 40 L60 50" />
    <path d="M10 75 L60 50 L110 75" />
    <!-- Garment silhouette lines -->
    <path d="M25 80 L35 140 C50 145, 70 145, 85 140 L95 80" />
    <path d="M40 95 C50 100, 70 100, 80 95" />
  </g>
  
  <!-- VYBE typographic wordmark -->
  <text x="300" y="470" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="600" letter-spacing="6" fill="#292526">
    VYBE
  </text>
  
  <!-- Product Concept Tag -->
  <rect x="190" y="505" width="220" height="28" rx="14" fill="#ffffff" stroke="#e9e2e1" />
  <circle cx="210" cy="519" r="4" fill="#f4acb7" />
  <text x="310" y="523" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#6e6668">
    CONCEPT PROTOTYPE
  </text>
  
  <text x="300" y="560" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#9d8189" letter-spacing="0.5">
    Photography Pending Owner Supply
  </text>
</svg>
